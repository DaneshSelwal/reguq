name: Bug report
description: Wrong result, crash, or a guarantee that does not hold
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      render: python
    validations: {required: true}
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "python -c \"import reguq, sklearn, numpy, sys; print(reguq.__version__, sklearn.__version__, numpy.__version__, sys.version)\""
    validations: {required: true}
