name: CI

on:
  push:
    branches: [main, "v1.0-rewrite"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test-core:
    # Core install only (numpy/scipy/pandas/sklearn): proves `import reguq`
    # never pulls in torch or any boosting backend.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Import without optional deps
        run: |
          python -c "import sys, reguq; print(reguq.__version__); assert 'torch' not in sys.modules; assert 'lightgbm' not in sys.modules"
      - run: pytest -q -m "not slow"

  test-all-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU torch first (smaller wheel)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[all,dev]"
      - run: pytest -q -m "not slow"
