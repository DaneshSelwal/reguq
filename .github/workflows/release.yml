name: Release

# Tag vX.Y.Z -> build sdist+wheel, test the built wheel, create a GitHub release,
# and publish to PyPI with trusted publishing (configure the "pypi" environment first).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl pytest
          cd /tmp && python -c "import reguq; print(reguq.__version__)"
          pytest -q -m "not slow" "$GITHUB_WORKSPACE/tests" -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/p/reguq"}
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
