[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reguq"
dynamic = ["version"]
description = "Regression uncertainty quantification: conformal prediction, quantile and probabilistic regression with correct, tested guarantees"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Danesh Selwal" }]
keywords = ["uncertainty quantification", "conformal prediction", "quantile regression", "probabilistic regression", "prediction intervals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core stays light: every heavy backend is an optional extra.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
gpboost = ["gpboost>=1.5"]
ngboost = ["ngboost>=0.5"]
torch = ["torch>=2.0"]
pgbm = ["pgbm>=2.2", "torch>=2.0"]
tabnet = ["pytorch-tabnet>=4.1", "torch>=2.0"]
qrf = ["quantile-forest>=1.3"]
treeffuser = ["treeffuser>=0.1"]
mapie = ["mapie>=1.0"]
puncc = ["puncc>=0.8"]
tuning = ["optuna>=3.6", "optunahub>=0.1"]
report = ["matplotlib>=3.7", "openpyxl>=3.1", "XlsxWriter>=3.1", "PyYAML>=6.0"]
explain = ["shap>=0.44", "lime>=0.2"]
all = [
  "reguq[boosting,gpboost,ngboost,torch,pgbm,tabnet,qrf,treeffuser,mapie,puncc,tuning,report,explain]",
]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
reguq-run = "reguq.pipeline:main"

[project.urls]
Homepage = "https://github.com/DaneshSelwal/reguq"
Repository = "https://github.com/DaneshSelwal/reguq"
Issues = "https://github.com/DaneshSelwal/reguq/issues"

[tool.setuptools.dynamic]
version = { attr = "reguq._version.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reguq = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "statistical: Monte-Carlo checks of coverage / calibration guarantees",
  "slow: long-running tests (run on Kaggle / nightly, not on every push)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = ["Data_folder", "examples", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/reguq/**/__init__.py" = ["F401"]
